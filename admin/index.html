<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aksara Learning Center — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #102B4E; --navy2: #1A4073; --gold: #B8934A; --gold2: #D4AF37;
      --cream: #F8F6F0; --text: #4A5568; --border: #EAE5D9;
      --ok: #1E6B3C; --err: #B3261E; --warn: #9A7334;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
    h1,h2,h3,h4 { color: var(--navy); font-family: 'Playfair Display', serif; }
    button { font-family: inherit; cursor: pointer; }
    input,select,textarea { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 9px; font-size: 0.95rem; font-family: inherit; color: #2D3748; background: #FDFCF9; }
    input:focus,select:focus,textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,147,74,0.15); }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { background: var(--navy); color: #fff; padding: 11px 10px; text-align: left; font-weight: 600; }
    td { padding: 11px 10px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: rgba(184,147,74,0.05); }

    /* Layout */
    .shell { display: none; }
    .shell.on { display: block; }
    .topbar { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand b { font-family: 'Playfair Display', serif; letter-spacing: 2px; font-size: 1.15rem; }
    .brand small { display: block; font-size: 0.55rem; letter-spacing: 3px; color: var(--gold2); text-transform: uppercase; }
    .topbar .who { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
    .tbtn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 0.8rem; font-weight: 700; }
    .tbtn:hover { background: rgba(255,255,255,0.22); }
    .nav { display: flex; gap: 4px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--border); padding: 0 14px; }
    .nav button { border: none; background: none; padding: 13px 14px; font-size: 0.85rem; font-weight: 700; color: var(--text); border-bottom: 3px solid transparent; white-space: nowrap; }
    .nav button.active { color: var(--navy); border-bottom-color: var(--gold); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 22px; }

    .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 18px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .stat { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
    .stat .n { font-size: 1.6rem; font-weight: 800; color: var(--navy); }
    .stat .l { font-size: 0.72rem; margin-top: 3px; text-transform: uppercase; letter-spacing: 1px; }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-n { background: var(--navy); color: #fff; } .btn-n:hover { background: var(--navy2); }
    .btn-g { background: var(--gold); color: #fff; } .btn-g:hover { background: var(--gold2); }
    .btn-o { background: #fff; color: var(--navy); border: 1px solid var(--border); } .btn-o:hover { border-color: var(--gold); color: var(--gold); }
    .btn-d { background: #FDECEA; color: var(--err); } 
    .btn-sm { padding: 7px 11px; font-size: 0.72rem; }

    .badge { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
    .b-ok { background: #E8F5E9; color: var(--ok); } .b-warn { background: #FFF6E5; color: var(--warn); }
    .b-err { background: #FDECEA; color: var(--err); } .b-info { background: #E8F0F9; color: var(--navy2); }
    .st-Baru { background: #E3F2FD; color: #1565C0; } .st-Selesai { background: #E8F5E9; color: #2E7D32; } .st-Ditolak { background: #FFEBEE; color: #C62828; }

    .toast { position: fixed; top: 18px; right: 18px; z-index: 300; max-width: 380px; padding: 14px 18px; border-radius: 10px; font-size: 0.9rem; display: none; box-shadow: 0 10px 30px rgba(16,43,78,0.25); white-space: pre-line; }
    .toast.ok { background: #E8F5E9; color: var(--ok); border: 1px solid #BFE3C8; }
    .toast.err { background: #FDECEA; color: var(--err); border: 1px solid #F5C6C1; }

    .modal-bg { position: fixed; inset: 0; background: rgba(16,43,78,0.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 18px; }
    .modal-bg.on { display: flex; }
    .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal .mh { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal .mb { padding: 22px; }
    .modal .mf { padding: 15px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
    .fg { margin-bottom: 14px; } .fg label { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--navy); margin-bottom: 6px; }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .empty { text-align: center; padding: 40px 16px; color: var(--text); }
    .mono { font-family: monospace; font-size: 0.8rem; }
    .search-in { max-width: 320px; }
    @media (max-width: 640px) { .frow { grid-template-columns: 1fr; } .topbar { padding: 12px 14px; } .wrap { padding: 14px; } }

    /* Login */
    .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--navy) 0%, #0d1f38 100%); padding: 18px; }
    .login-box { background: #fff; border-radius: 18px; max-width: 400px; width: 100%; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.4); }
    .login-head { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: #fff; text-align: center; padding: 30px; }
    .login-head h1 { color: #fff; font-size: 1.4rem; letter-spacing: 2px; }
    .login-head p { color: var(--gold2); font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
    .login-body { padding: 28px; }
    .login-err { display: none; background: #FDECEA; color: var(--err); padding: 11px 14px; border-radius: 9px; font-size: 0.85rem; margin-bottom: 16px; }
  </style>
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div class="login" id="login">
    <div class="login-box">
      <div class="login-head">
        <h1>AKSARA</h1>
        <p>Learning Center — Sistem Internal</p>
      </div>
      <div class="login-body">
        <div class="login-err" id="login-err"></div>
        <form onsubmit="doLogin(event)">
          <div class="fg"><label>Username atau Email</label><input id="lg-user" required autocomplete="username" placeholder="username / email"></div>
          <div class="fg"><label>Password</label><input id="lg-pass" type="password" required autocomplete="current-password" placeholder="password"></div>
          <button class="btn btn-n" style="width:100%; justify-content:center;" id="lg-btn">🔐 Masuk</button>
        </form>
        <p style="text-align:center; margin-top:14px;"><a href="#" onclick="forgotPass(); return false;" style="font-size:0.83rem; color:var(--navy2);">Lupa password?</a></p>
      </div>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div class="shell" id="shell">
    <div class="topbar">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 75 Q 35 65 50 75 Q 65 65 80 75 L 85 80 Q 65 70 50 82 Q 35 70 15 80 Z" fill="#fff"/>
          <path d="M50 15 L30 65 L40 65 L50 40 L60 65 L70 65 Z" fill="#fff"/>
          <path d="M35 45 Q 50 25 65 50 Q 55 40 45 45 Z" fill="#D4AF37"/>
          <path d="M50 8 L52 14 L58 14 L53 18 L55 24 L50 20 L45 24 L47 18 L42 14 L48 14 Z" fill="#D4AF37"/>
        </svg>
        <div><b>AKSARA</b><small>Sistem Manajemen</small></div>
      </div>
      <div class="who">
        <span id="who-label"></span>
        <button class="tbtn" id="btn-cp" onclick="openChangePass()">🔑 Ganti Password</button>
        <button class="tbtn" onclick="doLogout()">🚪 Keluar</button>
      </div>
    </div>

    <div class="nav" id="nav">
      <button data-page="dashboard" class="active">📊 Dashboard</button>
      <button data-page="students">👨‍🎓 Murid</button>
      <button data-page="classes">🏫 Kelas</button>
      <button data-page="attendance">📝 Absensi</button>
      <button data-page="progress">📈 Progres</button>
      <button data-page="savings">💰 Tabungan</button>
      <button data-page="transactions">🧾 Transaksi</button>
      <button data-page="reports">📄 Laporan</button>
      <button data-page="stats">📊 Statistik</button>
      <button data-page="users">👥 Users</button>
      <button data-page="registrations">📥 Pendaftar</button>
      <button data-page="activitylog">📜 Log</button>
      <button data-page="loginhistory">🕘 Riwayat Login</button>
      <button data-page="settings">💬 WhatsApp</button>
    </div>

    <div class="wrap"><div id="page"></div></div>
  </div>

  <div class="modal-bg" id="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="mh"><h3 id="m-title"></h3><button class="btn-o btn btn-sm" onclick="closeModal()">✕</button></div>
      <div class="mb" id="m-body"></div>
      <div class="mf" id="m-foot"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  // ============ KONFIGURASI (WAJIB DIISI) ============
  // URL web app Apps Script (backend spreadsheet). Lihat ../README.md langkah 1-2.
  const API_URL = 'https://script.google.com/macros/s/AKfycbxjwUMcd0jj45u8Bl0qWS5dQC62WRWLUCcnJZSostMnoZRd1Sg8XlwD6etd5zF5s3-aKA/exec';

  // ============ STATE & API HELPER ============
  const state = { token: localStorage.getItem('aksara_token') || '', me: null, cache: {}, students: [] };
  const $ = id => document.getElementById(id);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');

  let toastTimer;
  function toast(msg, type) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || 'ok');
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, type === 'err' ? 6000 : 4000);
  }

  async function api(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    const r = await fetch(API_URL + '?api=call&token=' + encodeURIComponent(state.token), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args })
    });
    const data = await r.json();
    if (data && data.needLogin) { hardLogout(); throw new Error('Sesi berakhir. Silakan login ulang.'); }
    if (data && data.success === false) {
      // Sesi tidak valid → kembali ke login; error lain → tampilkan pesan
      if (/sesi tidak valid/i.test(data.message || '')) { hardLogout(); throw new Error(data.message); }
      throw new Error(data.message || 'Terjadi kesalahan.');
    }
    return data;
  }

  async function post(endpoint, payload) {
    const r = await fetch(API_URL + '?api=' + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload || {})
    });
    return r.json();
  }

  // ============ AUTH ============
  async function doLogin(e) {
    e.preventDefault();
    const btn = $('lg-btn'), err = $('login-err');
    btn.disabled = true; btn.textContent = '⏳ Memproses...';
    err.style.display = 'none';
    try {
      const res = await post('login', { login: $('lg-user').value.trim(), password: $('lg-pass').value });
      if (res && res.success && res.token) {
        state.token = res.token;
        localStorage.setItem('aksara_token', res.token);
        await boot();
      } else {
        err.textContent = (res && res.message) || 'Login gagal.';
        err.style.display = 'block';
      }
    } catch (ex) {
      err.textContent = 'Koneksi gagal: ' + ex.message;
      err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = '🔐 Masuk';
  }

  function forgotPass() {
    const login = prompt('Tuliskan username atau email akun Anda.\nAdmin akan mengirim password baru ke email Anda.');
    if (!login) return;
    post('forgot-password', { login: login.trim() }).then(res => {
      toast((res && res.message) || 'Permintaan terkirim.', (res && res.success) ? 'ok' : 'err');
    }).catch(() => toast('Koneksi gagal.', 'err'));
  }

  function hardLogout() {
    state.token = ''; state.me = null; state.cache = {};
    localStorage.removeItem('aksara_token');
    $('shell').classList.remove('on');
    $('login').style.display = 'flex';
  }

  async function doLogout() {
    try { await post('logout', { token: state.token }); } catch (e) {}
    hardLogout();
  }

  async function boot() {
    let me;
    try {
      me = await post('me', { token: state.token });
    } catch (e) { toast('Tidak bisa menghubungi server.', 'err'); hardLogout(); return; }
    if (!me || !me.success) { hardLogout(); return; }
    state.me = me;
    $('login').style.display = 'none';
    $('shell').classList.add('on');
    $('who-label').textContent = '👤 ' + (me.nama || me.email) + ' · ' + me.peran;
    $('btn-cp').style.display = '';
    applyGate(me.peran);
    loadPage(state.currentPage || 'dashboard');
  }

  // ============ NAV & GATE ============
  state.currentPage = 'dashboard';
  document.querySelectorAll('#nav button').forEach(b => {
    b.addEventListener('click', () => loadPage(b.dataset.page));
  });

  function applyGate(peran) {
    const adminOnly = ['users', 'registrations'];
    const parentOnly = peran === 'Orang Tua';
    document.querySelectorAll('#nav button').forEach(b => {
      const p = b.dataset.page;
      if (parentOnly) b.style.display = (p === 'dashboard') ? '' : 'none';
      else if (peran !== 'Admin') b.style.display = adminOnly.includes(p) ? 'none' : '';
      else b.style.display = '';
    });
  }

  function setActiveNav(page) {
    state.currentPage = page;
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  }

  async function loadPage(page) {
    setActiveNav(page);
    const el = $('page');
    const cached = state.cache[page];
    if (cached) { RENDER[page](cached); } else { el.innerHTML = '<div class="empty">⏳ Memuat...</div>'; }
    try {
      let data;
      if (page === 'dashboard') {
        data = state.me.peran === 'Orang Tua' ? await api('getMyChildrenData') : await api('getDashboardData');
      } else if (page === 'students') data = await api('getStudents');
      else if (page === 'classes') data = await api('getClasses');
      else if (page === 'attendance') data = await api('getAttendanceToday');
      else if (page === 'savings') data = await api('getSavingsAccounts');
      else if (page === 'transactions') data = await api('getAllTransactions');
      else if (page === 'users') data = await api('getUsers');
      else if (page === 'registrations') data = await api('getRegistrations');
      else if (page === 'progress') data = {};
      else if (page === 'reports') data = await api('getReportSettings');
      else if (page === 'stats') data = await api('getStatsData');
      else if (page === 'activitylog') data = await api('getActivityLog', 200);
      else if (page === 'loginhistory') { const res = await api('getLoginHistory', lhLimit); data = res.data || []; }
      else if (page === 'settings') data = await api('getWhatsAppSettings');
      state.cache[page] = data;
      RENDER[page](data);
    } catch (ex) {
      el.innerHTML = '<div class="card"><div class="empty">⚠️ ' + esc(ex.message) + '<br><br><button class="btn btn-o btn-sm" onclick="loadPage(\'' + page + '\')">🔄 Coba Lagi</button></div></div>';
    }
  }

  const RENDER = {
    // ---------- DASHBOARD ----------
    dashboard: function(data) {
      if (data.children) { // Orang Tua
        const cards = (data.children || []).map(c => {
          const abs = (c.absensi || []);
          const hadir = abs.filter(a => a.status === 'Hadir').length;
          const persen = abs.length ? Math.round(hadir / abs.length * 100) : 0;
          const tx = (c.transaksi || []).slice(0, 5).map(t =>
            '<tr><td>' + new Date(t.tanggal).toLocaleDateString('id-ID') + '</td><td><span class="badge ' + (t.jenis === 'Setoran' ? 'b-ok' : 'b-warn') + '">' + t.jenis + '</span></td><td style="text-align:right;">' + rp(t.jumlah) + '</td></tr>').join('');
          const ab = abs.slice(-7).reverse().map(a =>
            '<tr><td>' + new Date(a.tanggal).toLocaleDateString('id-ID') + '</td><td><span class="badge ' + (a.status === 'Hadir' ? 'b-ok' : (a.status === 'Alpha' ? 'b-err' : 'b-warn')) + '">' + a.status + '</span></td></tr>').join('');
          const pr = (c.progres || []).slice(0, 5).map(p =>
            '<tr><td>' + new Date(p.tanggal).toLocaleDateString('id-ID') + '</td><td>' + esc(p.mapel) + '</td><td>' + esc(p.topik) + '</td><td style="text-align:right;"><b>' + (p.nilai === '' || p.nilai == null ? '-' : p.nilai) + '</b></td></tr>').join('');
          return '<div class="card"><div class="card-head"><h3>👨‍🎓 ' + esc(c.nama) + ' — ' + esc(c.kelas) + '</h3><span class="badge b-ok">' + rp(c.saldo) + '</span></div>' +
            '<div class="grid"><div><h4 style="margin-bottom:8px;">💰 Tabungan</h4><table><tbody>' + (tx || '<tr><td>Belum ada transaksi.</td></tr>') + '</tbody></table></div>' +
            '<div><h4 style="margin-bottom:8px;">📝 Kehadiran ' + (abs.length ? '· ' + persen + '%' : '') + '</h4><table><tbody>' + (ab || '<tr><td>Belum ada catatan.</td></tr>') + '</tbody></table></div>' +
            '<div><h4 style="margin-bottom:8px;">📈 Progres</h4><table><tbody>' + (pr || '<tr><td>Belum ada catatan.</td></tr>') + '</tbody></table></div></div></div>';
        }).join('');
        $('page').innerHTML = '<div class="card"><div class="card-head"><h2>👋 Selamat datang, ' + esc(data.namaOrangTua || state.me.nama || 'Orang Tua') + '</h2></div><p style="font-size:0.9rem;">Pemantauan data anak Anda: tabungan, kehadiran, dan progres belajar.</p></div>' + (cards || '<div class="card"><div class="empty">Belum ada data anak tertaut ke akun ini. Hubungi admin.</div></div>');
        return;
      }
      const s = data.stats || {};
      $('page').innerHTML =
        '<div class="card-head" style="margin-bottom:16px;"><h2>📊 Dashboard</h2><button class="btn btn-o btn-sm" onclick="state.cache = {}; loadPage(\'dashboard\')">🔄 Refresh</button></div>' +
        '<div class="grid">' +
        '<div class="stat"><div class="n">' + (s.totalStudents || 0) + '</div><div class="l">Total Murid</div></div>' +
        '<div class="stat"><div class="n">' + (s.activeStudents || 0) + '</div><div class="l">Murid Aktif</div></div>' +
        '<div class="stat"><div class="n">' + (s.totalClasses || 0) + '</div><div class="l">Kelas</div></div>' +
        '<div class="stat"><div class="n">' + rp(s.netTotal) + '</div><div class="l">Total Saldo</div></div>' +
        '</div>' +
        '<div class="card" style="margin-top:18px;"><div class="card-head"><h3>🧾 Transaksi Terbaru</h3></div>' +
        ((data.recentTransactions || []).length ? '<table><thead><tr><th>Nama</th><th>Jenis</th><th style="text-align:right;">Jumlah</th><th>Waktu</th></tr></thead><tbody>' +
          data.recentTransactions.map(t => '<tr><td><b>' + esc(t.nama) + '</b></td><td><span class="badge ' + (t.jenis === 'Setoran' ? 'b-ok' : 'b-err') + '">' + t.jenis + '</span></td><td style="text-align:right;">' + rp(t.jumlah) + '</td><td>' + esc(t.waktu) + '</td></tr>').join('') +
          '</tbody></table>' : '<div class="empty">Belum ada transaksi.</div>') + '</div>' +
        '<div class="card"><div class="card-head"><h3>⚡ Aksi Cepat</h3></div><div style="display:flex; gap:10px; flex-wrap:wrap;">' +
        '<button class="btn btn-n btn-sm" onclick="openAddStudent()">➕ Murid</button>' +
        '<button class="btn btn-n btn-sm" onclick="openAddClass()">➕ Kelas</button>' +
        '<button class="btn btn-g btn-sm" onclick="openAttendance()">📝 Absensi</button>' +
        '<button class="btn btn-o btn-sm" onclick="openTransaction()">💰 Transaksi</button></div></div>';
      state.students = data.students || [];
      state.cache.students = data.students;
    },

    // ---------- STUDENTS ----------
    students: function(list) {
      list = list || [];
      state.students = list;
      const rows = list.map((s, i) =>
        '<tr><td>' + (i + 1) + '</td><td><b>' + esc(s.nama) + '</b></td><td>' + esc(s.kelasNama || '-') + '</td><td>' + esc(s.noHP || '-') + '</td>' +

    // ---------- STATS (SVG, senada dengan web app) ----------
    stats: function(st) {
      st = st || {};
      const months = (st.monthly || []).map(m => m.label);
      const W = 640, H = 260, P = { top: 20, right: 20, bottom: 30, left: 60 };
      const maxTx = Math.max(1, ...(st.monthly || []).map(m => Math.max(m.deposit, m.withdraw)));
      const cw = (W - P.left - P.right) / Math.max(1, months.length);
      const y = v => H - P.bottom - (v / maxTx) * (H - P.top - P.bottom);
      let bars = '';
      for (let g = 0; g <= 4; g++) {
        bars += '<line x1="' + P.left + '" y1="' + y(maxTx * g / 4) + '" x2="' + (W - P.right) + '" y2="' + y(maxTx * g / 4) + '" stroke="#EAE5D9"/>' +
          '<text x="' + (P.left - 8) + '" y="' + (y(maxTx * g / 4) + 4) + '" text-anchor="end" font-size="11" fill="#999">' + fmtCompact(maxTx * g / 4) + '</text>';
      }
      (st.monthly || []).forEach((d, i) => {
        const bw = Math.max(4, cw * 0.32), x1 = P.left + i * cw + cw / 2;
        if (d.deposit > 0) bars += '<rect x="' + (x1 - bw - 1) + '" y="' + y(d.deposit) + '" width="' + bw + '" height="' + (H - P.bottom - y(d.deposit)) + '" rx="3" fill="#0F9D58"><title>Setoran ' + d.label + ': ' + rp(d.deposit) + '</title></rect>';
        if (d.withdraw > 0) bars += '<rect x="' + (x1 + 1) + '" y="' + y(d.withdraw) + '" width="' + bw + '" height="' + (H - P.bottom - y(d.withdraw)) + '" rx="3" fill="#d93025"><title>Tarik ' + d.label + ': ' + rp(d.withdraw) + '</title></rect>';
        bars += '<text x="' + x1 + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#999">' + d.label + '</text>';
      });
      const maxAtt = Math.max(1, ...(st.byClass || []).map(c => c.Hadir + c.Sakit + c.Izin + c.Alpha));
      const rw = (W - P.left - P.right) / Math.max(1, (st.byClass || []).length);
      let att = '';
      (st.byClass || []).forEach((c, i) => {
        let acc2 = 0; const bw = Math.max(4, rw * 0.55), x0 = P.left + i * rw + (rw - bw) / 2;
        ['Hadir', 'Sakit', 'Izin', 'Alpha'].forEach(stn => {
          const h = (c[stn] / maxAtt) * (H - P.top - P.bottom);
          if (c[stn] > 0) att += '<rect x="' + x0 + '" y="' + (H - P.bottom - ((acc2 + c[stn]) / maxAtt) * (H - P.top - P.bottom)) + '" width="' + bw + '" height="' + Math.max(1, h) + '" fill="#' + ({ Hadir: '0F9D58', Sakit: 'F4B400', Izin: '1a73e8', Alpha: 'd93025' }[stn]) + '"><title>' + esc(c.nama) + ' — ' + stn + ': ' + c[stn] + '</title></rect>';
          acc2 += c[stn];
        });
        att += '<text x="' + (x0 + bw / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="10" fill="#999">' + esc(c.nama.length > 8 ? c.nama.slice(0, 7) + '…' : c.nama) + '</text>';
      });
      $('page').innerHTML =
        '<div class="card-head" style="margin-bottom:16px;"><h2>📊 Statistik</h2><span style="font-size:0.82rem;">12 bulan terakhir · ' + (st.totalTransactions || 0) + ' transaksi · ' + (st.totalAttendance || 0) + ' absensi</span></div>' +
        '<div class="card"><h3 style="margin-bottom:6px;">💰 Setoran vs Penarikan per Bulan</h3>' +
        '<p style="font-size:0.78rem; margin-bottom:10px;"><span class="sw" style="background:#0F9D58;"></span> Setoran &nbsp;<span class="sw" style="background:#d93025;"></span> Penarikan</p>' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:auto;">' + bars + '</svg></div>' +
        '<div class="card"><h3 style="margin-bottom:6px;">📝 Absensi per Kelas</h3>' +
        ((st.byClass || []).length ? '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:auto;">' + att + '</svg>' : '<p style="font-size:0.85rem;">Belum ada kelas.</p>') + '</div>';
    },

  // ---------- EXPORT CSV (browser) ----------
  function downloadCSV(filename, rows) {
    const csv = rows.map(r => r.map(c => { const s = String(c == null ? '' : c); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast('✅ ' + filename + ' diunduh.', 'ok');
  }

        let msg = res.message || 'Berhasil!';
        if (res.username && res.password) msg += '\n\n🔑 Login orang tua — Username: ' + res.username + ' | Password: ' + res.password;
        toast(msg, 'ok');
        state.cache = {}; loadPage('registrations');
      } else { toast(res.message || 'Gagal.', 'err'); }
    } catch (ex) { toast(ex.message, 'err'); }
  }

  async function rejectReg(id) {
    if (!confirm('Tolak pendaftaran ini?')) return;
    try { const res = await api('rejectRegistration', id); toast(res.message || 'OK', 'ok'); loadPage('registrations'); }
    catch (ex) { toast(ex.message, 'err'); }
  }

  // ============ GANTI PASSWORD SENDIRI ============
  function openChangePass() {
    modal('🔑 Ganti Password',
      '<div class="fg"><label>Password Lama *</label><input type="password" id="cp-old"></div>' +
      '<div class="fg"><label>Password Baru *</label><input type="password" id="cp-new" placeholder="min. 6 karakter"></div>' +
      '<div class="fg"><label>Ulangi Password Baru *</label><input type="password" id="cp-new2"></div>',
      '<button class="btn btn-o btn-sm" onclick="closeModal()">Batal</button><button class="btn btn-n btn-sm" onclick="saveChangePass()">💾 Simpan</button>');
  }

  async function saveChangePass() {
    const oldPass = $('cp-old').value, newPass = $('cp-new').value, newPass2 = $('cp-new2').value;
    if (!oldPass || !newPass) { toast('Semua kolom wajib diisi.', 'err'); return; }
    if (newPass !== newPass2) { toast('Ulangi password tidak sama.', 'err'); return; }
    if (newPass.length < 6) { toast('Password baru minimal 6 karakter.', 'err'); return; }
    try {
      const res = await post('change-password', { token: state.token, oldPass, newPass });
      closeModal(); toast(res.message || 'Selesai.', (res && res.success) ? 'ok' : 'err');
    } catch (ex) { toast(ex.message, 'err'); }
  }

  // ============ BOOT ============
  if (state.token && API_URL) {
    boot();
  } else if (!API_URL) {
    // Konfigurasi belum diisi — tampilkan petunjuk di layar login
    document.querySelector('.login-body').insertAdjacentHTML('afterbegin',
      '<div style="background:#FFF6E5; border:1px solid #EAD9B0; color:#9A7334; padding:12px 14px; border-radius:9px; font-size:0.82rem; margin-bottom:16px;">⚠️ <b>Belum dikonfigurasi.</b> Isi <code>API_URL</code> di file ini dengan URL web app Apps Script (lihat README).</div>');
  }
</script>
</body>
</html>
